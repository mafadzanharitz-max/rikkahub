name: ARMv7a 3.3.0 compatibility build

on:
  push:
    branches:
      - adaptive-hybrid/implementation
      - port/armv7a-3.3.0
      - security/http-log-redaction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armv7a-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-armv7a:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false
      - name: Install web UI dependencies
        working-directory: web-ui
        # The checked-in lockfile is not accepted by pnpm in this CI environment.
        # Disable lockfile parsing for this compatibility build; package.json remains the dependency manifest.
        run: pnpm install --lockfile=false
      - name: Fetch pinned ARMv7 native build overlay
        run: |
          git clone https://github.com/jacob-ayang/rikkahub-armv7a.git "$RUNNER_TEMP/armv7-overlay"
          git -C "$RUNNER_TEMP/armv7-overlay" checkout 70b7cae6f8c5200bc6af7337a9c83b991bdc1f14
          cp -a "$RUNNER_TEMP/armv7-overlay/fork" ./fork
          mkdir -p scripts/ci
          cp "$RUNNER_TEMP/armv7-overlay/scripts/ci/apply-overlay.py" scripts/ci/
          cp "$RUNNER_TEMP/armv7-overlay/scripts/ci/build-native.py" scripts/ci/
          cp "$RUNNER_TEMP/armv7-overlay/scripts/ci/setup-android.py" scripts/ci/
          # Align the pinned overlay's rootfs hook with the current rollback-safe installer.
          python3 - <<'PY'
          from pathlib import Path

          script = Path("scripts/ci/apply-overlay.py")
          source = script.read_text()
          old = "linuxDir.deleteRecursively()"
          if source.count(old) != 2:
              raise SystemExit("Pinned overlay rootfs hook changed; refusing unsafe patch")
          source = source.replace(old, "if (backupDir.exists() && !linuxDir.exists())")
          script.write_text(source)
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = Path("fork/config.json")
          data = json.loads(cfg.read_text())
          data["repository"] = "mafadzanharitz-max/rikkahub"
          cfg.write_text(json.dumps(data, indent=2) + "\n")
          for name in ("Armv7Updates.kt", "Armv7UpdatesTest.kt"):
              path = Path("fork/templates") / name
              path.write_text(path.read_text().replace(
                  "jacob-ayang/rikkahub-armv7a", "mafadzanharitz-max/rikkahub"
              ))
          PY
      - name: Apply fail-closed ARMv7 source adaptations
        run: python3 scripts/ci/apply-overlay.py .
      - name: Verify rootfs validation hook before transactional replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("workspace/src/main/java/me/rerere/workspace/RootfsInstaller.kt")
          lines = path.read_text().splitlines()
          matches = [
              i for i, line in enumerate(lines[:-2])
              if line.strip() == "extractTar(archive, stagingDir, format, onProgress)"
              and lines[i + 1].strip() == "Armv7Rootfs.validate(stagingDir)"
              and lines[i + 2].strip().startswith("if (backupDir.exists()")
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one validated rootfs transaction hook, found {len(matches)}"
              )
          print("Verified rootfs validation runs after extraction and before backup/replacement.")
          PY
      - name: Install pinned Android SDK, NDK and CMake
        run: python3 scripts/ci/setup-android.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Allow cache writes for trusted branch pushes; keep pull-request jobs read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Create CI-only Google Services configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-armv7-ci",
              "storage_bucket": "rikkahub-armv7-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {"package_name": "me.rerere.rikkahub"}
                },
                "api_key": [{"current_key": "ci-placeholder-not-a-real-key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": {"package_name": "me.rerere.rikkahub.debug"}
                },
                "api_key": [{"current_key": "ci-placeholder-not-a-real-key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Build checksum-locked ARMv7 native components
        run: python3 scripts/ci/build-native.py
      - name: Configure permanent release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64 secret}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing RELEASE_KEYSTORE_PASSWORD secret}"
          : "${RELEASE_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS secret}"
          : "${RELEASE_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD secret}"

          KEYSTORE="$RUNNER_TEMP/rikkahub-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          # Validate each credential separately without printing any secret.
          if ! keytool -list -keystore "$KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened. Check RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore opened, but RELEASE_KEY_ALIAS was not found."
            exit 1
          fi

          # Verify that the private-key password unlocks the selected key.
          export KEYSTORE
          if ! jshell --execution local <<'JAVA' >/dev/null 2>&1
          import java.io.*;
          import java.nio.file.*;
          import java.security.*;
          import java.security.PrivateKey;
          char[] storePass = System.getenv("RELEASE_KEYSTORE_PASSWORD").toCharArray();
          char[] keyPass = System.getenv("RELEASE_KEY_PASSWORD").toCharArray();
          KeyStore ks = KeyStore.getInstance("PKCS12");
          try (InputStream in = Files.newInputStream(Path.of(System.getenv("KEYSTORE")))) {
              ks.load(in, storePass);
          }
          String alias = System.getenv("RELEASE_KEY_ALIAS");
          if (!(ks.getKey(alias, keyPass) instanceof PrivateKey)) throw new Exception("Private key unavailable");
          System.out.println("Private key password validated");
          /exit
          JAVA
          then
            echo "::error::Keystore and alias are valid, but RELEASE_KEY_PASSWORD does not unlock the private key."
            exit 1
          fi

          # Write Java-properties-safe values without printing credentials.
          export KEYSTORE
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              if any(ch in value for ch in "\r\n\t\f"):
                  raise SystemExit("Signing values must not contain line breaks or tabs")
              out = []
              for i, ch in enumerate(value):
                  if ch == "\\":
                      out.append("\\\\")
                  elif ch in "=:#!" or (ch == " " and i == 0):
                      out.append("\\" + ch)
                  else:
                      out.append(ch)
              return "".join(out)

          values = {
              "storeFile": os.environ["KEYSTORE"],
              "storePassword": os.environ["RELEASE_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["RELEASE_KEY_ALIAS"],
              "keyPassword": os.environ["RELEASE_KEY_PASSWORD"],
          }
          Path("local.properties").write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY
      - name: Compile, test, and build Debug plus optimized Release
        run: |
          ./gradlew :app:assembleGithubDebug :app:testGithubDebugUnitTest \
            :workspace:testDebugUnitTest :terminal:testDebugUnitTest \
            :app:assembleGithubRelease \
            --stacktrace --build-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify APK ABI and required native components
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = next(pathlib.Path("app/build/outputs/apk/github/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as archive:
              libs = [n for n in archive.namelist() if n.startswith("lib/") and n.endswith(".so")]
              assert libs, "APK contains no native libraries"
              wrong = [n for n in libs if not n.startswith("lib/armeabi-v7a/")]
              assert not wrong, f"Unexpected ABI entries: {wrong}"
              names = {pathlib.PurePosixPath(n).name for n in libs}
              required = {"libsimple.so", "libtermux.so", "libworkspace.so",
                          "libproot_exec.so", "libproot_loader.so"}
              assert required <= names, f"Missing native components: {sorted(required - names)}"
              print(f"Validated {len(libs)} ARMv7 ELF libraries in {apk}")
          PY
      - name: Report APK size breakdown
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = next(pathlib.Path("app/build/outputs/apk/github/debug").glob("*.apk"))
          groups = {"DEX": [], "Native": [], "Resources": [], "Assets": [], "Other": []}
          with zipfile.ZipFile(apk) as archive:
              entries = [(info.filename, info.file_size, info.compress_size)
                         for info in archive.infolist() if not info.is_dir()]
              for name, raw, packed in entries:
                  if name.endswith(".dex"):
                      group = "DEX"
                  elif name.startswith("lib/") and name.endswith(".so"):
                      group = "Native"
                  elif name.startswith("res/") or name == "resources.arsc":
                      group = "Resources"
                  elif name.startswith("assets/"):
                      group = "Assets"
                  else:
                      group = "Other"
                  groups[group].append((name, raw, packed))
              total_raw = sum(raw for _, raw, _ in entries)
              total_packed = sum(packed for _, _, packed in entries)
              lines = [
                  "## APK size audit",
                  f"- APK file: **{apk.stat().st_size / 1024 / 1024:.2f} MiB**",
                  f"- ZIP entries: **{len(entries)}**",
                  "",
                  "| Group | Uncompressed | Compressed |",
                  "|---|---:|---:|",
              ]
              for group, items in groups.items():
                  raw = sum(x[1] for x in items)
                  packed = sum(x[2] for x in items)
                  lines.append(f"| {group} | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              lines += ["", "### 15 largest uncompressed entries", "| Entry | Uncompressed | Compressed |", "|---|---:|---:|"]
              for name, raw, packed in sorted(entries, key=lambda x: x[1], reverse=True)[:15]:
                  lines.append(f"| `{name}` | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              pathlib.Path("/tmp/apk-audit-summary.md").write_text("\n".join(lines) + "\n")
              print("\n".join(lines))
          PY
          cat /tmp/apk-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: RikkaHub-3.3.0-ARMv7a-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify and report optimized release APK
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk_dir = pathlib.Path("app/build/outputs/apk/github/release")
          apks = list(apk_dir.glob("*.apk"))
          assert len(apks) == 1, f"Expected one release APK, found: {apks}"
          apk = apks[0]
          groups = {"DEX": [], "Native": [], "Resources": [], "Assets": [], "Other": []}
          with zipfile.ZipFile(apk) as archive:
              entries = [(i.filename, i.file_size, i.compress_size)
                         for i in archive.infolist() if not i.is_dir()]
              libs = [n for n, _, _ in entries if n.startswith("lib/") and n.endswith(".so")]
              assert libs, "Release APK contains no native libraries"
              wrong = [n for n in libs if not n.startswith("lib/armeabi-v7a/")]
              assert not wrong, f"Unexpected release ABI entries: {wrong}"
              names = {pathlib.PurePosixPath(n).name for n in libs}
              required = {"libsimple.so", "libtermux.so", "libworkspace.so",
                          "libproot_exec.so", "libproot_loader.so"}
              assert required <= names, f"Missing native components: {sorted(required - names)}"
              for name, raw, packed in entries:
                  if name.endswith(".dex"):
                      group = "DEX"
                  elif name.startswith("lib/") and name.endswith(".so"):
                      group = "Native"
                  elif name.startswith("res/") or name == "resources.arsc":
                      group = "Resources"
                  elif name.startswith("assets/"):
                      group = "Assets"
                  else:
                      group = "Other"
                  groups[group].append((name, raw, packed))
              lines = [
                  "## Optimized ARMv7 Release APK audit",
                  f"- APK: **{apk}**",
                  f"- APK file size: **{apk.stat().st_size / 1024 / 1024:.2f} MiB**",
                  f"- ZIP entries: **{len(entries)}**",
                  f"- Verified native libraries: **{len(libs)} ARMv7 ELF entries**",
                  "",
                  "| Group | Uncompressed | Compressed |",
                  "|---|---:|---:|",
              ]
              for group, items in groups.items():
                  raw = sum(x[1] for x in items)
                  packed = sum(x[2] for x in items)
                  lines.append(f"| {group} | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              lines += ["", "### 15 largest release entries", "| Entry | Uncompressed | Compressed |", "|---|---:|---:|"]
              for name, raw, packed in sorted(entries, key=lambda x: x[1], reverse=True)[:15]:
                  lines.append(f"| `{name}` | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              report = "\n".join(lines) + "\n"
              print(report)
              pathlib.Path("/tmp/release-apk-audit.md").write_text(report)
          PY
          cat /tmp/release-apk-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify optimized Release APK signature and permanent certificate
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/github/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -x "$APKSIGNER"
          REPORT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$REPORT"
          printf '%s\n' "$REPORT" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          CERT_SHA256="$(printf '%s\n' "$REPORT" | sed -nE 's/^V2 Signer: certificate SHA-256 digest: ([0-9A-Fa-f]+)$/\1/p' | head -n1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT_SHA256="e03d78eb2eaffe01a278f6d755698065bea6030d7f7ca937ec556345de1b3987"
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Release APK certificate does not match the permanent RikkaHub release key."
            exit 1
          fi
          echo "Verified APK Signature Scheme v2 and permanent release certificate SHA-256."
      - uses: actions/upload-artifact@v7
        with:
          name: RikkaHub-3.3.0-ARMv7a-release
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove generated CI configuration and temporary signing material
        if: always()
        run: |
          rm -f app/google-services.json local.properties
          rm -f "$RUNNER_TEMP/rikkahub-ci-release.jks"
          rm -f "$RUNNER_TEMP/rikkahub-release.jks"
