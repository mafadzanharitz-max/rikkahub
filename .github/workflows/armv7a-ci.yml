name: ARMv7a 3.3.0 compatibility build

on:
  push:
    branches:
      - port/armv7a-3.3.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armv7a-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-armv7a:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
          run_install: false
      - name: Install web UI dependencies
        working-directory: web-ui
        # The checked-in lockfile is not accepted by pnpm in this CI environment.
        # Disable lockfile parsing for this compatibility build; package.json remains the dependency manifest.
        run: pnpm install --lockfile=false
      - name: Fetch pinned ARMv7 native build overlay
        run: |
          git clone https://github.com/jacob-ayang/rikkahub-armv7a.git "$RUNNER_TEMP/armv7-overlay"
          git -C "$RUNNER_TEMP/armv7-overlay" checkout 70b7cae6f8c5200bc6af7337a9c83b991bdc1f14
          cp -a "$RUNNER_TEMP/armv7-overlay/fork" ./fork
          mkdir -p scripts/ci
          cp "$RUNNER_TEMP/armv7-overlay/scripts/ci/apply-overlay.py" scripts/ci/
          cp "$RUNNER_TEMP/armv7-overlay/scripts/ci/build-native.py" scripts/ci/
          cp "$RUNNER_TEMP/armv7-overlay/scripts/ci/setup-android.py" scripts/ci/
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = Path("fork/config.json")
          data = json.loads(cfg.read_text())
          data["repository"] = "mafadzanharitz-max/rikkahub"
          cfg.write_text(json.dumps(data, indent=2) + "\n")
          for name in ("Armv7Updates.kt", "Armv7UpdatesTest.kt"):
              path = Path("fork/templates") / name
              path.write_text(path.read_text().replace(
                  "jacob-ayang/rikkahub-armv7a", "mafadzanharitz-max/rikkahub"
              ))
          PY
      - name: Apply fail-closed ARMv7 source adaptations
        run: python3 scripts/ci/apply-overlay.py .
      - name: Install pinned Android SDK, NDK and CMake
        run: python3 scripts/ci/setup-android.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Allow cache writes for trusted branch pushes; keep pull-request jobs read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Create CI-only Google Services configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-armv7-ci",
              "storage_bucket": "rikkahub-armv7-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {"package_name": "me.rerere.rikkahub"}
                },
                "api_key": [{"current_key": "ci-placeholder-not-a-real-key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": {"package_name": "me.rerere.rikkahub.debug"}
                },
                "api_key": [{"current_key": "ci-placeholder-not-a-real-key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Build checksum-locked ARMv7 native components
        run: python3 scripts/ci/build-native.py
      - name: Create temporary CI-only release signing key
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/rikkahub-ci-release.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias ci-release \
            -dname "CN=RikkaHub CI Temporary,O=CI,C=US" \
            -keyalg RSA -keysize 2048 -validity 2
          {
            echo "storeFile=$KEYSTORE"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=ci-release"
            echo "keyPassword=$STORE_PASSWORD"
          } > local.properties
      - name: Compile, test, and build Debug plus optimized Release
        run: |
          ./gradlew :app:assembleGithubDebug :app:testGithubDebugUnitTest \
            :workspace:testDebugUnitTest :terminal:testDebugUnitTest \
            :app:assembleGithubRelease \
            --stacktrace --build-cache --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify APK ABI and required native components
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = next(pathlib.Path("app/build/outputs/apk/github/debug").glob("*.apk"))
          with zipfile.ZipFile(apk) as archive:
              libs = [n for n in archive.namelist() if n.startswith("lib/") and n.endswith(".so")]
              assert libs, "APK contains no native libraries"
              wrong = [n for n in libs if not n.startswith("lib/armeabi-v7a/")]
              assert not wrong, f"Unexpected ABI entries: {wrong}"
              names = {pathlib.PurePosixPath(n).name for n in libs}
              required = {"libsimple.so", "libtermux.so", "libworkspace.so",
                          "libproot_exec.so", "libproot_loader.so"}
              assert required <= names, f"Missing native components: {sorted(required - names)}"
              print(f"Validated {len(libs)} ARMv7 ELF libraries in {apk}")
          PY
      - name: Report APK size breakdown
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk = next(pathlib.Path("app/build/outputs/apk/github/debug").glob("*.apk"))
          groups = {"DEX": [], "Native": [], "Resources": [], "Assets": [], "Other": []}
          with zipfile.ZipFile(apk) as archive:
              entries = [(info.filename, info.file_size, info.compress_size)
                         for info in archive.infolist() if not info.is_dir()]
              for name, raw, packed in entries:
                  if name.endswith(".dex"):
                      group = "DEX"
                  elif name.startswith("lib/") and name.endswith(".so"):
                      group = "Native"
                  elif name.startswith("res/") or name == "resources.arsc":
                      group = "Resources"
                  elif name.startswith("assets/"):
                      group = "Assets"
                  else:
                      group = "Other"
                  groups[group].append((name, raw, packed))
              total_raw = sum(raw for _, raw, _ in entries)
              total_packed = sum(packed for _, _, packed in entries)
              lines = [
                  "## APK size audit",
                  f"- APK file: **{apk.stat().st_size / 1024 / 1024:.2f} MiB**",
                  f"- ZIP entries: **{len(entries)}**",
                  "",
                  "| Group | Uncompressed | Compressed |",
                  "|---|---:|---:|",
              ]
              for group, items in groups.items():
                  raw = sum(x[1] for x in items)
                  packed = sum(x[2] for x in items)
                  lines.append(f"| {group} | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              lines += ["", "### 15 largest uncompressed entries", "| Entry | Uncompressed | Compressed |", "|---|---:|---:|"]
              for name, raw, packed in sorted(entries, key=lambda x: x[1], reverse=True)[:15]:
                  lines.append(f"| `{name}` | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              pathlib.Path("/tmp/apk-audit-summary.md").write_text("\n".join(lines) + "\n")
              print("\n".join(lines))
          PY
          cat /tmp/apk-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: RikkaHub-3.3.0-ARMv7a-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify and report optimized release APK
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apk_dir = pathlib.Path("app/build/outputs/apk/github/release")
          apks = list(apk_dir.glob("*.apk"))
          assert len(apks) == 1, f"Expected one release APK, found: {apks}"
          apk = apks[0]
          groups = {"DEX": [], "Native": [], "Resources": [], "Assets": [], "Other": []}
          with zipfile.ZipFile(apk) as archive:
              entries = [(i.filename, i.file_size, i.compress_size)
                         for i in archive.infolist() if not i.is_dir()]
              libs = [n for n, _, _ in entries if n.startswith("lib/") and n.endswith(".so")]
              assert libs, "Release APK contains no native libraries"
              wrong = [n for n in libs if not n.startswith("lib/armeabi-v7a/")]
              assert not wrong, f"Unexpected release ABI entries: {wrong}"
              names = {pathlib.PurePosixPath(n).name for n in libs}
              required = {"libsimple.so", "libtermux.so", "libworkspace.so",
                          "libproot_exec.so", "libproot_loader.so"}
              assert required <= names, f"Missing native components: {sorted(required - names)}"
              for name, raw, packed in entries:
                  if name.endswith(".dex"):
                      group = "DEX"
                  elif name.startswith("lib/") and name.endswith(".so"):
                      group = "Native"
                  elif name.startswith("res/") or name == "resources.arsc":
                      group = "Resources"
                  elif name.startswith("assets/"):
                      group = "Assets"
                  else:
                      group = "Other"
                  groups[group].append((name, raw, packed))
              lines = [
                  "## Optimized ARMv7 Release APK audit",
                  f"- APK: **{apk}**",
                  f"- APK file size: **{apk.stat().st_size / 1024 / 1024:.2f} MiB**",
                  f"- ZIP entries: **{len(entries)}**",
                  f"- Verified native libraries: **{len(libs)} ARMv7 ELF entries**",
                  "",
                  "| Group | Uncompressed | Compressed |",
                  "|---|---:|---:|",
              ]
              for group, items in groups.items():
                  raw = sum(x[1] for x in items)
                  packed = sum(x[2] for x in items)
                  lines.append(f"| {group} | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              lines += ["", "### 15 largest release entries", "| Entry | Uncompressed | Compressed |", "|---|---:|---:|"]
              for name, raw, packed in sorted(entries, key=lambda x: x[1], reverse=True)[:15]:
                  lines.append(f"| `{name}` | {raw / 1024 / 1024:.2f} MiB | {packed / 1024 / 1024:.2f} MiB |")
              report = "\n".join(lines) + "\n"
              print(report)
              pathlib.Path("/tmp/release-apk-audit.md").write_text(report)
          PY
          cat /tmp/release-apk-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: RikkaHub-3.3.0-ARMv7a-release-size-test
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove generated CI configuration and temporary signing material
        if: always()
        run: |
          rm -f app/google-services.json local.properties
          rm -f "$RUNNER_TEMP/rikkahub-ci-release.jks"
